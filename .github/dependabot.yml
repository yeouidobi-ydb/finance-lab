# 의존성 버전 올리기 PR을 자동으로 연다. 머지는 사람이 결정한다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
  - package-ecosystem: cargo
    # 도구마다 Cargo.toml이 따로 있다. 새 도구도 자동으로 포함된다.
    directories:
      - /tools/*
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
