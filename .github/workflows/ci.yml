name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 PR에 새 커밋이 오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 외부 액션은 태그 대신 커밋 SHA로 고정한다 (태그가 바뀌어도 코드가 바뀌지 않게).
# 버전 올리기는 .github/dependabot.yml이 PR로 올려 준다.

jobs:
  structure:
    name: 도구 구성 확인 (Python + Rust 짝)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: tools/<name>/ 마다 <name>.py, <name>.rs, Cargo.toml, README.md가 있는지 확인
        run: |
          status=0
          for dir in tools/*/; do
            name=$(basename "$dir")
            for f in "$name.py" "$name.rs" Cargo.toml README.md; do
              if [ ! -f "$dir$f" ]; then
                echo "::error file=$dir::$dir$f 가 없습니다"
                status=1
              fi
            done
          done
          exit $status

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: 문법 확인
        run: python -m compileall -q tools
      - name: 표준 라이브러리만으로 import 되는지 확인 (네트워크 호출 없음)
        run: |
          for dir in tools/*/; do
            name=$(basename "$dir")
            python -c "import sys; sys.path.insert(0, '$dir'); import $name" || exit 1
            echo "ok: $name"
          done

  rust:
    name: Rust
    runs-on: ubuntu-latest
    env:
      # 모든 도구가 저장소 루트의 target/ 하나를 같이 쓴다 (캐시 공유)
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: 빌드
        run: |
          for manifest in tools/*/Cargo.toml; do
            echo "== $manifest"
            cargo build --manifest-path "$manifest"
          done

  rust-lint:
    # 참고용: 아직 필수 검사가 아니다. 실패해도 이 작업은 통과로 표시되고 경고만 남긴다.
    # 기존 코드를 맞춘 뒤 continue-on-error를 지우고 main 보호 규칙의 필수 검사에 넣는다.
    name: Rust 스타일 (참고)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo fmt --check
        continue-on-error: true
        run: |
          for manifest in tools/*/Cargo.toml; do
            echo "== $manifest"
            cargo fmt --manifest-path "$manifest" -- --check
          done
      - name: cargo clippy (경고를 오류로)
        continue-on-error: true
        run: |
          for manifest in tools/*/Cargo.toml; do
            echo "== $manifest"
            cargo clippy --manifest-path "$manifest" -- -D warnings
          done
